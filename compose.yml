services:
  trustshield:
    build:
      context: .
      dockerfile: Dockerfile
    image: trustshield:latest
    container_name: trustshield
    restart: unless-stopped
    # Set these to the owner of an existing host-mounted data directory when
    # migrating a non-container installation.  Defaults match appuser in the
    # image and work with the named volume below.
    user: "${TRUSTSHIELD_UID:-10001}:${TRUSTSHIELD_GID:-10001}"
    env_file:
      - ./backend/.env
    environment:
      # Keep database, encrypted uploads, exports and runtime model settings
      # outside the image.  The named volume survives image/container updates.
      CONTRACTGUARD_DATA_DIR: /data
      # Frontend is served by this same container, so browser requests are
      # same-origin.  Add an HTTPS/domain origin here only when placing a
      # separate reverse proxy or frontend in front of it.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
    ports:
      # By default Docker publishes the service for a stand-alone deployment.
      # Behind an existing local Nginx/Caddy proxy, set the bind address to
      # 127.0.0.1 so the application port is not exposed directly.
      - "${TRUSTSHIELD_BIND_ADDRESS:-0.0.0.0}:${TRUSTSHIELD_PORT:-8000}:8000"
    volumes:
      - "${TRUSTSHIELD_DATA_VOLUME:-trustshield-data}:/data"

volumes:
  trustshield-data:
